[package]
name = "plexus-parse-helper-rs"
version = "0.1.0"
edition = "2021"
description = "Spike: Plexus local parse helper in Rust (Apple Vision OCR, same HTTP contract)"
license = "MIT"
publish = false

[[bin]]
name = "plexus-parse-helper-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3", features = ["VNGeometry", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }
pdfium-render = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
