[project]
name = "plexus-parse-helper"
version = "0.1.0"
description = "Local Docling helper that serves pxd-parse/1 to Plexus Diagram"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "docling>=2.91",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pypdfium2>=4.30",
]

[project.scripts]
plexus-parse-helper = "plexus_parse_helper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plexus_parse_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
